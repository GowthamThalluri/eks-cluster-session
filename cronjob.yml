apiVersion: batch/v1
kind: CronJob

metadata:
  name: hello-cronjob
  namespace: k8s-demo

spec:

  schedule: "*/5 * * * *"

  jobTemplate:

    spec:

      template:

        spec:

          restartPolicy: Never

          containers:

            - name: hello
              image: busybox:1.36

              command:
                - sh
                - -c
                - |
                  echo "CronJob executed at $(date)"
