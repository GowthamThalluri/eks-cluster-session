apiVersion: batch/v1
kind: Job

metadata:
  name: hello-job
  namespace: k8s-demo

spec:

  completions: 1

  backoffLimit: 3

  template:

    metadata:
      labels:
        app: hello-job

    spec:

      restartPolicy: Never

      containers:

        - name: hello
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Starting Kubernetes Job"
              sleep 10
              echo "Job completed successfully"
