apiVersion: v1
kind: Pod

metadata:
  name: configmap-demo
  namespace: k8s-demo

spec:

  containers:

    - name: nginx
      image: nginx:1.27

      env:

        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_ENV

        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_NAME
